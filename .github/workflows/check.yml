name: Verify storefront and commerce Worker

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx tsc --project worker/tsconfig.json
      - run: npx wrangler d1 migrations apply DB --local --config worker/wrangler.toml
      - run: npx wrangler deploy --dry-run --env production --config worker/wrangler.toml
